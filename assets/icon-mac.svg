<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- macOS 图标：和 icon.svg 同一个图案，按苹果的图标网格留出边距、加一点投影 -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F8BFF"/>
      <stop offset="1" stop-color="#6A4CF5"/>
    </linearGradient>
    <filter id="s" x="-10%" y="-10%" width="120%" height="125%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="10" result="b"/>
      <feFlood flood-color="#000" flood-opacity="0.28"/>
      <feComposite in2="b" operator="in" result="sh"/>
      <feMerge><feMergeNode in="sh"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#s)">
    <rect x="100" y="92" width="824" height="824" rx="185" fill="url(#g)"/>
  </g>
  <g transform="translate(100 92) scale(3.4333) translate(-8 -8)" fill="none" stroke="#fff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <path d="M60 90 H184"/>
    <path d="M152 60 L188 90 L152 120"/>
    <path d="M196 166 H72"/>
    <path d="M104 136 L68 166 L104 196"/>
  </g>
</svg>
